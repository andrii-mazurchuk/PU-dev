name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version pyproject declares as the minimum, not a newer one that
      # happens to work: a dev machine on 3.14 will not notice a 3.13-only
      # keyword, and CI testing 3.11 would not have named the real floor.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # The task store is a subprocess wrapper around a real binary. Installing
      # it here is what lets the suite exercise the real thing rather than only
      # an injected fake -- the failure mode that let six launch bugs survive a
      # fully green suite in a sibling unit.
      - name: install taskwarrior
        run: sudo apt-get update && sudo apt-get install -y taskwarrior
      - run: task --version
      - run: pip install -e ".[dev]"
      - run: pytest

  # pu/dashboard.html is a build artefact of web/ (UNIT_STANDARDS.md,
  # page-tier rule 1 as amended in holonic-node 6b50dfb): rebuild it and
  # fail if the committed file is not exactly what the source produces.
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run typecheck
        working-directory: web
      # The app's own checks: the data layer's merge and scoped reads, and
      # the charts. The page-tier rules on the shipped file are pytest's.
      - run: bun test
        working-directory: web
      - run: bun run build
        working-directory: web
      - name: the committed page matches a fresh build
        run: git diff --exit-code -- pu/dashboard.html
